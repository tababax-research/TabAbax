[project]
name = "tababax"
dynamic = ["version"]
description = "TabAbax: sklearn estimators for tabular classification and regression"
readme = "README.md"
authors = [
    { name = "TabAbax" },
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["tabular data", "TabAbax"]
classifiers = [
    "License :: Other/Proprietary License",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "torch>=2.2",
    "scikit-learn>=1.3.0",
    "numpy",
    "scipy",
    "pandas",
    "einops>=0.7",
    "psutil",
    "tqdm>=4.64.0",
    "huggingface-hub",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[build-system]
requires = ["hatchling>=1.26.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tababax/__about__.py"

[tool.hatch.build.targets.sdist]
only-include = ["src/tababax", "LICENSE", "NOTICE", "README.md", "requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/tababax"]

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.envs.hatch-test]
default-args = ["tests"]
installer = "uv"
features = ["test"]
